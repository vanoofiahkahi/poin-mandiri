<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poin Mandiri</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2457c5">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f5f9;--card:#fff;--txt:#162033;--mut:#667085;--bd:#e3e7ee;--pri:#2457c5;--pri-s:#e8eefc;--ok:#15803d;--ok-s:#e3f6e9;--bad:#c62828;--bad-s:#fde8e8;--gold:#b7791f;--gold-s:#fdf3e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#171e29;--txt:#e8edf5;--mut:#98a2b3;--bd:#273142;--pri:#6f9bff;--pri-s:#1d2a44;--ok:#4ade80;--ok-s:#14301f;--bad:#f87171;--bad-s:#3a1717;--gold:#f2b84b;--gold-s:#3a2c12}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#171e29;--txt:#e8edf5;--mut:#98a2b3;--bd:#273142;--pri:#6f9bff;--pri-s:#1d2a44;--ok:#4ade80;--ok-s:#14301f;--bad:#f87171;--bad-s:#3a1717;--gold:#f2b84b;--gold-s:#3a2c12}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;min-height:46px;background:var(--pri);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--txt);border:1px solid var(--bd)}
button.soft{background:var(--pri-s);color:var(--pri)}
button.ok{background:var(--ok);color:#fff}
button.bad{background:transparent;color:var(--bad);border:1px solid var(--bd)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--txt);min-height:46px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--bd);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:800;font-size:19px;padding:4px 12px 18px;letter-spacing:-.01em}
.brand span{color:var(--pri)}
.tab{background:transparent;color:var(--mut);text-align:left;font-weight:600;padding:14px 14px;border-radius:12px}
.tab.on{background:var(--pri-s);color:var(--pri)}
.sync{margin-top:auto;font-size:12px;color:var(--mut);padding:8px 12px}
main{padding:22px 26px 40px;min-width:0}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:14px}
.lvl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl b{font-size:20px}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .4s}
h2{font-size:20px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.row>.fit{flex:0 0 auto;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--pri-s);color:var(--pri)}
.chip.ok{background:var(--ok-s);color:var(--ok)}
.chip.bad{background:var(--bad-s);color:var(--bad)}
.chip.gold{background:var(--gold-s);color:var(--gold)}
.pts{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.timer{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:8px 0}
.center{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:26px;border:1px dashed var(--bd);border-radius:14px}
.calc{background:var(--gold-s);border-radius:12px;padding:14px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.calc b{font-size:22px;color:var(--gold)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{background:transparent;color:var(--txt);border:1px solid var(--bd);font-weight:600}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw}
.hide{display:none!important}
#alerts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
#alerts:empty{display:none}
.alert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card)}
.alert .grow{flex:1;min-width:200px}
.alert.warn{background:var(--gold-s);border-color:transparent}
.alert.bad{background:var(--bad-s);border-color:transparent}
.alert.info{background:var(--pri-s);border-color:transparent}
.alert b{display:block}
.small{font-size:13px}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.item button.sm{min-height:40px;padding:8px 12px;font-size:14px}
@media (max-width:820px){.item{flex-wrap:wrap}.item .acts{width:100%}}
.sp{height:16px}
table{width:100%;border-collapse:collapse}
td{padding:8px 4px;border-bottom:1px solid var(--bd);vertical-align:middle}
td input{min-height:40px;padding:8px}
td button{min-height:40px;padding:6px 12px}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--bd);z-index:10;justify-content:space-around}
 .brand,.sync{display:none}
 .tab{flex:1;text-align:center;padding:10px 4px;font-size:13px}
 main{padding:16px 16px 100px}
 .hero,.grid2{grid-template-columns:1fr}
 .big{font-size:38px}.timer{font-size:52px}
}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">Poin <span>Mandiri</span></div>
    <button class="tab on" data-v="tugas">Tugas</button>
    <button class="tab" data-v="ujian">Ujian</button>
    <button class="tab" data-v="belajar">Belajar</button>
    <button class="tab" data-v="reward">Reward</button>
    <button class="tab" data-v="riwayat">Riwayat</button>
    <button class="tab" data-v="atur">Atur</button>
    <div class="sync" id="sync">Memuat…</div>
  </nav>
  <main>
    <section class="hero">
      <div class="card">
        <div class="mut">Saldo poin</div>
        <div class="big" id="saldo">0</div>
        <div class="mut" id="sub" style="margin-top:8px"></div>
      </div>
      <div class="card">
        <div class="lvl"><b id="lvName">-</b><span class="mut" id="lvNext"></span></div>
        <div class="bar"><i id="lvBar" style="width:0"></i></div>
        <div class="mut">Level naik dari total poin yang pernah didapat, bukan saldo.</div>
      </div>
    </section>
    <div id="alerts"></div>
    <div id="view"></div>
  </main>
</div>
<div class="toast hide" id="toast"></div>

<script>
/* ---------- State ---------- */
const DEF={
  v:1,
  diff:[{n:'Mudah',p:10},{n:'Sedang',p:25},{n:'Sulit',p:50},{n:'Ekstrem',p:100}],
  study:{p:10,m:25},               // 10 poin tiap 25 menit
  rate:100,                        // 1 poin = Rp100
  levels:[{n:'Pemula',min:0},{n:'Rajin',min:500},{n:'Tekun',min:1500},{n:'Disiplin',min:4000},{n:'Mandiri',min:10000}],
  rewards:[{id:'r1',n:'Main game 1 jam',p:60},{id:'r2',n:'Nonton 1 film',p:120},{id:'r3',n:'Jajan favorit',p:80}],
  tasks:[],exams:[],log:[],earned:0,balance:0,
  remind:{exam:'19:00',taskH:24,latePct:0,examBonus:20}
};
let S=structuredClone(DEF);
const LS='poin-mandiri-v1';
let DB=null,REF=null,saveT=null,writing=false,pending=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('id-ID');
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const now=()=>new Date().toISOString();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add('hide'),2200)}
function setSync(m){$('#sync').textContent=m}

function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function merge(d){S=Object.assign(structuredClone(DEF),d||{});S.remind=Object.assign({},DEF.remind,(d&&d.remind)||{});if(!Array.isArray(S.exams))S.exams=[]}

function persist(){
  lsSet();
  if(!REF){setSync('Tersimpan di perangkat ini');return}
  clearTimeout(saveT);saveT=setTimeout(flush,600);setSync('Menyimpan…');
}
async function flush(){
  if(writing){pending=true;return}
  writing=true;
  try{await REF.set(JSON.parse(JSON.stringify(S)));setSync('Tersimpan ke akun ✓')}
  catch(e){setSync(e&&e.code==='quota_exceeded'?'Penyimpanan penuh — hapus riwayat lama':'Tersimpan di perangkat ini')}
  writing=false;if(pending){pending=false;flush()}
}

/* ---------- Poin ---------- */
function add(p,what,kind){
  p=Math.round(p);if(!p)return;
  S.balance+=p;if(p>0)S.earned+=p;
  S.log.unshift({id:uid(),t:now(),p,what,kind});
  if(S.log.length>800)S.log.length=800;
  const before=levelOf(S.earned-Math.max(p,0)).i,after=levelOf(S.earned).i;
  persist();renderHero();
  if(after>before)toast('Naik level! Sekarang: '+S.levels[after].n);
}
function levelOf(e){
  const L=[...S.levels].sort((a,b)=>a.min-b.min);let i=0;
  L.forEach((l,k)=>{if(e>=l.min)i=k});
  S.levels=L;return{i,cur:L[i],next:L[i+1]};
}
function renderHero(){
  $('#saldo').textContent=fmt(S.balance);
  $('#sub').textContent='Total didapat '+fmt(S.earned)+' poin · setara '+rp(S.balance*S.rate);
  const {cur,next}=levelOf(S.earned);
  $('#lvName').textContent=cur?cur.n:'-';
  if(next){const pc=(S.earned-cur.min)/(next.min-cur.min)*100;$('#lvBar').style.width=Math.min(100,pc)+'%';$('#lvNext').textContent=fmt(next.min-S.earned)+' poin lagi → '+next.n}
  else{$('#lvBar').style.width='100%';$('#lvNext').textContent='Level tertinggi'}
}

/* ---------- Navigasi ---------- */
let V='tugas';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{V=b.dataset.v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
function render(){({tugas,ujian,belajar,reward,riwayat,atur})[V]();renderHero();alerts();syncReminders()}
function go(v){V=v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v===v));render();scrollTo(0,0)}

/* ---------- Waktu & tanggal ---------- */
const DAY=864e5;
const sod=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()};
const dayDiff=ms=>Math.round((sod(ms)-sod(Date.now()))/DAY);
const fdt=ms=>new Date(ms).toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const fd=ms=>new Date(ms).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
const dlMs=t=>t.dl?new Date(t.dl).getTime():null;
const examAt=e=>new Date(e.tgl+'T'+(e.jam||'07:00')).getTime();
function examNight(e){const d=new Date(e.tgl+'T00:00');d.setDate(d.getDate()-1);const [h,m]=(S.remind.exam||'19:00').split(':');d.setHours(+h||0,+m||0,0,0);return d.getTime()}
function dlChip(ms){
  const diff=ms-Date.now(),dd=dayDiff(ms);
  if(diff<0){const h=Math.floor(-diff/36e5);return `<span class="chip bad">Terlambat ${h<24?h+' jam':Math.floor(h/24)+' hari'}</span>`}
  if(dd===0){const h=Math.floor(diff/36e5),m=Math.floor(diff%36e5/6e4);return `<span class="chip bad">Hari ini · ${h?h+' jam ':''}${m} mnt lagi</span>`}
  if(dd===1)return `<span class="chip gold">Besok</span>`;
  return `<span class="chip">${dd} hari lagi</span>`;
}
/* Tautan Google Kalender: notifikasi muncul walau aplikasi ditutup */
const gutc=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function gcal(title,start,end,details){
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+gutc(start)+'/'+gutc(end)+'&details='+encodeURIComponent(details||'Dari Poin Mandiri');
}

/* ---------- Pengingat ---------- */
function reminderList(){
  const L=[];
  S.exams.filter(e=>!e.done).forEach(e=>{
    L.push({id:'ex-'+e.id+'-'+e.tgl,at:examNight(e),title:'Belajar malam ini: '+e.mapel,body:'Ujian '+e.mapel+' besok, '+fdt(examAt(e))+'. Ayo belajar sekarang!'});
  });
  S.tasks.filter(t=>!t.done&&t.dl).forEach(t=>{
    const d=dlMs(t);
    L.push({id:'dl-'+t.id+'-'+t.dl,at:d-S.remind.taskH*36e5,title:'Deadline mendekat: '+t.n,body:'Jatuh tempo '+fdt(d)+'.'});
    L.push({id:'due-'+t.id+'-'+t.dl,at:d,title:'Deadline sekarang: '+t.n,body:'Waktunya habis. Selesaikan secepatnya.'});
  });
  return L;
}
const NKEY='pm-notified';
const getN=()=>{try{return JSON.parse(localStorage.getItem(NKEY)||'{}')}catch(e){return{}}};
const setN=n=>{try{localStorage.setItem(NKEY,JSON.stringify(n))}catch(e){}};
async function notify(r){
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  try{const reg=await navigator.serviceWorker.ready;await reg.showNotification(r.title,{body:r.body,tag:r.id,icon:'icon-192.png',badge:'icon-192.png',renotify:true});return true}
  catch(e){try{new Notification(r.title,{body:r.body,tag:r.id});return true}catch(x){return false}}
}
let RT=[];
async function syncReminders(){
  const L=reminderList(),now=Date.now(),N=getN();
  try{const c=await caches.open('pm-data'),r=await c.match('./reminders.json');if(r){const d=await r.json();Object.assign(N,d.notified||{})}}catch(e){}
  // tampilkan yang sudah waktunya tapi belum diberitahukan (maks 12 jam lewat)
  for(const r of L){if(r.at<=now&&now-r.at<12*36e5&&!N[r.id]){if(await notify(r))N[r.id]=now}}
  for(const k in N)if(now-N[k]>30*DAY)delete N[k];
  setN(N);
  // jadwalkan yang dalam 24 jam ke depan selama aplikasi terbuka
  RT.forEach(clearTimeout);RT=[];
  L.filter(r=>r.at>now&&r.at-now<DAY).forEach(r=>RT.push(setTimeout(async()=>{const n=getN();if(n[r.id])return;if(await notify(r)){n[r.id]=Date.now();setN(n)}alerts()},r.at-now)));
  // salin ke service worker untuk pemeriksaan latar belakang
  try{const c=await caches.open('pm-data');await c.put('./reminders.json',new Response(JSON.stringify({list:L,notified:getN()}),{headers:{'Content-Type':'application/json'}}))}catch(e){}
}
setInterval(()=>{alerts();if(V==='tugas'||V==='ujian')render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

function alerts(){
  const box=$('#alerts'),out=[],now=Date.now();
  S.exams.filter(e=>!e.done).forEach(e=>{
    const dd=dayDiff(examAt(e));
    if(dd===1&&!e.studied)out.push(`<div class="alert warn"><div class="grow"><b>Ujian ${esc(e.mapel)} besok, ${new Date(examAt(e)).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</b><span class="small">${now>=examNight(e)?'Waktunya belajar malam ini.':'Jadwal belajar malam ini jam '+esc(S.remind.exam)+'.'}</span></div>
      <button class="sm" data-ast="${e.id}">Mulai belajar</button><button class="ok sm" data-asd="${e.id}">Sudah belajar (+${S.remind.examBonus})</button></div>`);
    else if(dd===0&&examAt(e)>now-3*36e5)out.push(`<div class="alert info"><div class="grow"><b>Ujian ${esc(e.mapel)} hari ini</b><span class="small">${fdt(examAt(e))}. Semangat!</span></div></div>`);
  });
  const late=S.tasks.filter(t=>!t.done&&t.dl&&dlMs(t)<now);
  const soon=S.tasks.filter(t=>!t.done&&t.dl&&dlMs(t)>=now&&dlMs(t)-now<=S.remind.taskH*36e5);
  if(late.length)out.push(`<div class="alert bad"><div class="grow"><b>${late.length} tugas lewat deadline</b><span class="small">${late.slice(0,3).map(t=>esc(t.n)).join(', ')}${late.length>3?'…':''}</span></div>${V!=='tugas'?'<button class="sm ghost" data-ago="tugas">Lihat</button>':''}</div>`);
  if(soon.length)out.push(`<div class="alert warn"><div class="grow"><b>${soon.length} tugas deadline dalam ${S.remind.taskH} jam</b><span class="small">${soon.slice(0,3).map(t=>esc(t.n)+' ('+fdt(dlMs(t))+')').join(', ')}</span></div>${V!=='tugas'?'<button class="sm ghost" data-ago="tugas">Lihat</button>':''}</div>`);
  box.innerHTML=out.join('');
  box.querySelectorAll('[data-ago]').forEach(b=>b.onclick=()=>go(b.dataset.ago));
  box.querySelectorAll('[data-ast]').forEach(b=>b.onclick=()=>startExamStudy(b.dataset.ast));
  box.querySelectorAll('[data-asd]').forEach(b=>b.onclick=()=>examStudied(b.dataset.asd));
}
function startExamStudy(id){const e=S.exams.find(x=>x.id===id);if(!e)return;TM.topic='Persiapan ujian '+e.mapel;saveTM();go('belajar');toast('Timer siap. Ketuk Mulai.')}
function examStudied(id){const e=S.exams.find(x=>x.id===id);if(!e||e.studied)return;e.studied=true;add(S.remind.examBonus,'Bonus belajar sebelum ujian: '+e.mapel,'ujian');toast('+'+S.remind.examBonus+' poin. Semoga lancar ujiannya!');render()}
const view=()=>$('#view');

/* ---------- Tugas ---------- */
function tugas(){
  const nw=Date.now();
  const open=S.tasks.filter(t=>!t.done).sort((a,b)=>(dlMs(a)??9e15)-(dlMs(b)??9e15));
  const done=S.tasks.filter(t=>t.done).slice(0,15);
  view().innerHTML=`
  <div class="card">
    <h2>Tambah tugas</h2>
    <div class="row">
      <div style="flex:2;min-width:220px"><label>Nama tugas</label><input id="tn" placeholder="Contoh: Laporan praktikum biologi"></div>
      <div><label>Kesulitan</label><select id="td">${S.diff.map((d,i)=>`<option value="${i}">${esc(d.n)} · ${d.p} poin</option>`).join('')}</select></div>
      <div><label>Deadline (opsional)</label><input id="tdl" type="datetime-local"></div>
      <button class="fit" id="ta">Tambah</button>
    </div>
    ${S.remind.latePct?`<p class="mut small" style="margin-bottom:0">Tugas yang selesai lewat deadline hanya mendapat ${100-S.remind.latePct}% poin.</p>`:''}
  </div>
  <div class="sp"></div>
  <h2>Belum selesai (${open.length})</h2>
  <div class="list">${open.length?open.map(t=>{const d=dlMs(t),late=d&&d<nw,p=late&&S.remind.latePct?Math.round(t.p*(1-S.remind.latePct/100)):t.p;return `
    <div class="item">
      <div class="grow"><div class="t">${esc(t.n)}</div>
        <span class="chip">${esc(t.d)}</span> ${d?dlChip(d)+` <span class="mut small">${fdt(d)}</span>`:'<span class="mut small">Tanpa deadline</span>'}</div>
      <span class="pts plus">+${p}</span>
      <div class="acts">
        ${d&&!late?`<a class="small" target="_blank" rel="noopener" href="${gcal('⏰ Deadline: '+t.n,Math.max(nw+6e4,d-S.remind.taskH*36e5),Math.max(nw+6e4,d-S.remind.taskH*36e5)+18e5,'Tugas "'+t.n+'" jatuh tempo '+fdt(d)+'.')}"><button class="ghost sm" tabindex="-1">+ Kalender</button></a>`:''}

  view().querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.done);
    const d=dlMs(t),late=!!(d&&Date.now()>d);let p=t.p;if(late&&S.remind.latePct)p=Math.round(p*(1-S.remind.latePct/100));

    S.tasks=[...S.tasks.filter(x=>!x.done),...S.tasks.filter(x=>x.done).sort((a,b)=>(b.at||'').localeCompare(a.at||''))].slice(0,300);

    box.innerHTML=`<input type="datetime-local" value="${esc(t.dl||'')}"><button class="fit sm">Simpan</button>${t.dl?'<button class="fit ghost sm">Hapus deadline</button>':''}`;
    b.closest('.item').appendChild(box);b.disabled=true;
    const [inp,sv,rm]=box.querySelectorAll('input,button');inp.focus();
    sv.onclick=()=>{t.dl=inp.value||'';persist();render();toast('Deadline disimpan')};
    if(rm)rm.onclick=()=>{t.dl='';persist();render();toast('Deadline dihapus')}});
  view().querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Hapus tugas ini?'))return;S.tasks=S.tasks.filter(x=>x.id!==b.dataset.del);persist();render()});
}

/* ---------- Belajar (timer) ---------- */
let TM=(()=>{try{return JSON.parse(localStorage.getItem('pm-timer')||'null')}catch(e){return null}})()||{run:false,start:0,acc:0,topic:''};
const saveTM=()=>{try{localStorage.setItem('pm-timer',JSON.stringify(TM))}catch(e){}};
const elapsed=()=>TM.acc+(TM.run?Date.now()-TM.start:0);
const ptsFor=min=>Math.floor(min/S.study.m)*S.study.p;
let tick=null;
function belajar(){
  view().innerHTML=`
  <div class="grid2">
    <div class="card">
      <h2>Timer belajar</h2>
      <label>Sedang belajar apa?</label>
      <input id="bt" placeholder="Contoh: Bahasa Inggris, coding, fisika" value="${esc(TM.topic)}">
      <div class="timer" id="clk">00:00:00</div>
      <div class="mut" style="text-align:center" id="clkp"></div>
      <div class="sp"></div>
      <div class="center">
        <button id="bs"></button>
        <button class="ok" id="bf">Selesai & ambil poin</button>
        <button class="ghost" id="br">Reset</button>
      </div>
    </div>
    <div class="card">
      <h2>Catat manual</h2>
      <p class="mut" style="margin-top:0">Untuk belajar yang tidak memakai timer.</p>
      <label>Topik</label><input id="mt" placeholder="Topik">
      <div class="sp"></div>
      <label>Durasi (menit)</label><input id="mm" type="number" inputmode="numeric" min="1" placeholder="60">
      <div class="calc"><span>Poin yang didapat</span><b id="mp">0</b></div>
      <button id="ms" style="width:100%">Simpan</button>
      <p class="mut">Aturan: <b>${S.study.p} poin</b> setiap <b>${S.study.m} menit</b>. Ubah di menu Atur.</p>
    </div>
  </div>`;
  const draw=()=>{const ms=elapsed(),s=Math.floor(ms/1000);
    $('#clk').textContent=[s/3600,s%3600/60,s%60].map(x=>String(Math.floor(x)).padStart(2,'0')).join(':');
    const m=Math.floor(ms/60000),nx=S.study.m-(m%S.study.m);
    $('#clkp').textContent=fmt(ptsFor(m))+' poin terkumpul · '+nx+' menit lagi untuk +'+S.study.p;
    $('#bs').textContent=TM.run?'Jeda':(TM.acc?'Lanjut':'Mulai');$('#bs').className=TM.run?'soft':''};
  clearInterval(tick);tick=setInterval(()=>{if(V==='belajar')draw();else clearInterval(tick)},1000);draw();
  $('#bt').oninput=e=>{TM.topic=e.target.value;saveTM()};
  $('#bs').onclick=()=>{if(TM.run){TM.acc+=Date.now()-TM.start;TM.run=false}else{TM.start=Date.now();TM.run=true}saveTM();draw()};
  $('#br').onclick=()=>{if(elapsed()>60000&&!confirm('Reset timer tanpa mengambil poin?'))return;TM={run:false,start:0,acc:0,topic:TM.topic};saveTM();draw()};
  $('#bf').onclick=()=>{const m=Math.floor(elapsed()/60000),p=ptsFor(m);
    if(m<1){toast('Belum ada waktu belajar');return}
    if(!p&&!confirm('Baru '+m+' menit, belum cukup untuk poin. Tetap selesaikan?'))return;
    if(p)add(p,'Belajar '+m+' menit'+(TM.topic?': '+TM.topic:''),'belajar');else toast('Sesi dicatat tanpa poin');
    if(p)toast('+'+p+' poin dari '+m+' menit belajar');
    TM={run:false,start:0,acc:0,topic:TM.topic};saveTM();draw()};
  const upd=()=>$('#mp').textContent=fmt(ptsFor(Number($('#mm').value)||0));$('#mm').oninput=upd;
  $('#ms').onclick=()=>{const m=Math.floor(Number($('#mm').value));if(!m||m<1){$('#mm').focus();return}
    const p=ptsFor(m);if(!p){toast('Minimal '+S.study.m+' menit untuk mendapat poin');return}
    const t=$('#mt').value.trim();add(p,'Belajar '+m+' menit'+(t?': '+t:''),'belajar');toast('+'+p+' poin');$('#mm').value='';$('#mt').value='';upd()};
}

          <span class="pts">${fmt(r.p)}</span>

  view().querySelectorAll('[data-rw]').forEach(b=>b.onclick=()=>{const r=S.rewards.find(x=>x.id===b.dataset.rw);

  on('[data-rp]',el=>S.rewards[el.dataset.rp].p=num(el.value,1));
  on('#sp',el=>S.study.p=num(el.value,1));on('#sm',el=>S.study.m=num(el.value,1));on('#rt',el=>S.rate=num(el.value,1));
  const rm=(sel,arr,keep)=>view().querySelectorAll(sel).forEach(b=>b.onclick=()=>{if(S[arr].length<=keep){toast('Minimal '+keep);return}S[arr].splice(Number(b.dataset[Object.keys(b.dataset)[0]]),1);persist();atur()});
  rm('[data-dx]','diff',1);rm('[data-lx]','levels',1);rm('[data-rx]','rewards',0);
  $('#da').onclick=()=>{S.diff.push({n:'Baru',p:30});persist();atur()};
  $('#la').onclick=()=>{const mx=Math.max(...S.levels.map(l=>l.min));S.levels.push({n:'Level baru',min:mx+5000});persist();atur()};
  $('#ra').onclick=()=>{S.rewards.push({id:uid(),n:'Reward baru',p:100});persist();atur()};
  on('#rx',el=>S.remind.exam=el.value||'19:00');on('#rh',el=>S.remind.taskH=num(el.value,1));on('#rb',el=>S.remind.examBonus=num(el.value,0));on('#rl',el=>S.remind.latePct=Math.min(100,num(el.value,0)));
  const nst=()=>{const t=!('Notification' in window)?'Tidak didukung di browser ini':Notification.permission==='granted'?'Aktif ✓':Notification.permission==='denied'?'Diblokir — izinkan dari pengaturan Chrome':'Belum diizinkan';$('#nst').textContent=t;$('#nb').classList.toggle('hide',!('Notification' in window)||Notification.permission!=='default')};nst();
  $('#nb').onclick=async()=>{try{await Notification.requestPermission()}catch(e){}nst();if(Notification.permission==='granted'){regPeriodic();toast('Notifikasi aktif')}};
  $('#nt').onclick=async()=>{if(!(await notify({id:'test',title:'Poin Mandiri',body:'Notifikasi berfungsi. Semangat belajar!'})))toast('Izinkan notifikasi dulu')};
  $('#kgo').onclick=()=>{const p=Math.round(Number($('#kp').value));if(!p){$('#kp').focus();return}
    if(p<0&&-p>S.balance&&!confirm('Saldo akan minus. Lanjutkan?'))return;
    add(p,'Koreksi: '+($('#ka').value.trim()||'manual'),'koreksi');$('#kp').value='';$('#ka').value='';toast('Saldo diperbarui')};
  $('#ex').onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);toast('Cadangan disalin. Simpan di catatan Anda.')}catch(e){$('#bx').classList.remove('hide');$('#bx').value=t;$('#bx').select();toast('Salin teks di kotak di bawah')}};
  $('#im').onclick=()=>{$('#bx').classList.remove('hide');$('#bxgo').classList.remove('hide');$('#bx').value='';$('#bx').focus()};
  $('#bxgo').onclick=()=>{try{const d=JSON.parse($('#bx').value);if(typeof d!=='object'||!Array.isArray(d.log))throw 0;
    if(!confirm('Ganti semua data dengan cadangan ini?'))return;merge(d);persist();toast('Data dipulihkan');render()}catch(e){toast('Teks cadangan tidak valid')}};
  $('#rs').onclick=()=>{if(!confirm('Hapus semua poin, tugas, dan riwayat? Pengaturan juga kembali ke awal.'))return;if(!confirm('Yakin? Ini tidak bisa dibatalkan.'))return;
    S=structuredClone(DEF);persist();toast('Semua data direset');render()};
}

/* ---------- Mulai ---------- */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
async function regPeriodic(){try{const r=await navigator.serviceWorker.ready;if(r.periodicSync)await r.periodicSync.register('pm-remind',{minInterval:60*60*1000})}catch(e){}}
if('Notification' in window&&Notification.permission==='granted')regPeriodic();
merge(lsGet());render();setSync('Tersimpan di perangkat ini');
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    DB=db;REF=db.doc('data/users/'+id+'/state');
    const snap=await REF.get();
    if(snap.exists){const d=snap.data();const local=lsGet();
      // pakai data akun, kecuali perangkat ini punya data lebih baru yang belum tersinkron
      const lt=local&&local.log&&local.log[0]?local.log[0].t:'',rt=d.log&&d.log[0]?d.log[0].t:'';
      if(local&&lt>rt){merge(local);flush()}else{merge(JSON.parse(JSON.stringify(d)));lsSet()}
      setSync('Tersimpan ke akun ✓');render();
    }else{await flush()}
    REF.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites||writing)return;
      const d=s.data();if(JSON.stringify(d)===JSON.stringify(S))return;
      merge(JSON.parse(JSON.stringify(d)));lsSet();if(V!=='atur')render();else renderHero()},()=>{});
  }catch(e){REF=null;setSync('Tersimpan di perangkat ini')}
})();
</script>
</body>
</html>
