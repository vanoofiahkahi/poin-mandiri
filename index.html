<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>remind+</title>
<meta name="description" content="remind+ — ingat ujian, kejar deadline, kumpulkan poin, naik level.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0B10" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="remind+">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script>
/* Terapkan tema sebelum halaman tampil agar tidak berkedip */
(function(){var p='auto';try{p=localStorage.getItem('remindplus:theme')||'auto'}catch(e){}
var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');
var f={};try{f=JSON.parse(localStorage.getItem('remindplus:fx')||'{}')||{}}catch(e){}
document.documentElement.setAttribute('data-glass',f.glass===false?'off':'on');
document.documentElement.setAttribute('data-motion',f.motion===false?'off':'on');
var lite=f.lite===undefined?/remindplus-android/.test(navigator.userAgent):f.lite;document.documentElement.setAttribute('data-lite',lite?'on':'off');})();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="root"><div class="boot"><img src="logo.svg" alt="" width="64" height="64"></div></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="alarm" class="alarm" hidden role="alertdialog" aria-live="assertive">
  <div class="alarm-ring"><svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"/></svg></div>
  <h1 id="alT"></h1><p id="alB"></p>
  <div class="alarm-btns"><button class="a-primary" id="alGo">Buka</button><button id="alSn">Tunda 10 menit</button><button id="alOff">Matikan</button></div>
</div>
<script src="js/i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/supa.js"></script>
<script src="js/qr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
