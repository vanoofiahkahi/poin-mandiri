plugins {
    id 'com.android.application'
}

def vCode = (project.findProperty('vCode') ?: '1').toString().toInteger()

android {
    namespace 'io.github.vanoofiahkahi.remindplus'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.vanoofiahkahi.remindplus'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "1." + vCode
    }

    signingConfigs {
        release {
            storeFile file('remindplus.keystore')
            storePassword 'remindplus'
            keyAlias 'remindplus'
            keyPassword 'remindplus'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
