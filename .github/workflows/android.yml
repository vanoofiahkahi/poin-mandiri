name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease -PvCode=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk remindplus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: remindplus-apk
          path: remindplus.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: remind+ Android (build ${{ github.run_number }})
          body: |
            remind+ untuk Android dengan widget layar utama "Jadwal berikutnya" dan pengingat yang tetap berbunyi walau aplikasi ditutup.
            Unduh **remindplus.apk** di bawah, lalu buka di tablet untuk memasang.
          files: remindplus.apk
          make_latest: true
